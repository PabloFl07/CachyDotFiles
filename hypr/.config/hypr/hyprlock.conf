# CONTROL DE FONDO DE PANTALLA
background {
    monitor =
    # REEMPLAZA abajo con la ruta real de tu fondo de Gargantua:
    path = ~/Imágenes/gargantua-black-3840x2160-9621.jpg
    
    # Efecto de desenfoque (blur) para que resalte la caja de texto
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# CAJA DE INPUT (CONTRASEÑA)
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.25 
    dots_spacing = 0.15 
    dots_center = true
    
    # Tonos a juego con tu paleta modificada
    outer_color = rgb(190, 135, 116)  # El cobrizo brillante de Gargantua
    inner_color = rgb(50, 58, 66)     # Tu gris oscuro cósmico
    font_color = rgb(230, 230, 224)   # Texto claro
    
    fade_on_empty = false
    placeholder_text = <i>Introduce tu contraseña...</i>
    hide_input = false
    
    position = 0, -20
    halign = center
    valign = center
}

# RELOJ EN PANTALLA
label {
    monitor =
    text = $TIME
    color = rgb(230, 230, 224)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 80
    halign = center
    valign = center
}
