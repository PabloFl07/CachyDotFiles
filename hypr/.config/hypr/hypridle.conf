general {
    lock_cmd = pidof hyprlock || hyprlock       # Ejecuta hyprlock si no está abierto
    before_sleep_cmd = loginctl lock-session    # Bloquea la pantalla antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # Enciende pantalla al despertar
}

# 1. Reducir brillo al 10% a los 2.5 min (150s)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 50%
    on-resume = brightnessctl -r
}

# 2. Bloquear la sesión a los 5 min (300s)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}